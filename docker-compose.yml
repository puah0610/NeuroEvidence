services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
